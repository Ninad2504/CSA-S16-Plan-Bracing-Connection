<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f5f5f5"/>

  <!-- Beam top and bottom flanges -->
  <g stroke="#333" stroke-width="6" fill="none">
    <rect x="120" y="230" width="960" height="34" fill="#c9d7a7"/>
    <rect x="120" y="440" width="960" height="34" fill="#c9d7a7"/>
  </g>

  <!-- Beam web -->
  <g stroke="#333" stroke-width="4" fill="none">
    <line x1="600" y1="230" x2="600" y2="474"/>
    <line x1="120" y1="264" x2="1080" y2="264" stroke-dasharray="10 8"/>
    <line x1="120" y1="440" x2="1080" y2="440" stroke-dasharray="10 8"/>
  </g>

  <!-- Central gusset connection -->
  <g>
    <polygon points="560,350 720,350 720,525 560,525" fill="#d2e6f6" stroke="#333" stroke-width="4"/>
    <polygon points="560,350 720,350 720,270 640,210 560,270" fill="#f6d3dc" stroke="#333" stroke-width="4"/>
  </g>

  <!-- Brace member (HSS) -->
  <g>
    <polygon points="600,190 660,105 760,105 700,190" fill="#7ac8d7" stroke="#333" stroke-width="4"/>
    <polygon points="520,450 600,190 700,190 620,450" fill="#7ac8d7" stroke="#333" stroke-width="4"/>
  </g>

  <!-- Brace cut and connection detail -->
  <g stroke="#333" stroke-width="3" fill="none">
    <line x1="500" y1="450" x2="620" y2="450"/>
    <line x1="700" y1="190" x2="760" y2="105"/>
    <line x1="650" y1="190" x2="725" y2="115"/>
  </g>

  <!-- Beam stiffener plates -->
  <g>
    <rect x="560" y="295" width="18" height="190" fill="#9ab48d" stroke="#333" stroke-width="3"/>
    <rect x="662" y="295" width="18" height="190" fill="#9ab48d" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Welds -->
  <g stroke="#d94141" stroke-width="3" fill="none">
    <line x1="560" y1="350" x2="720" y2="350"/>
    <line x1="560" y1="410" x2="720" y2="410"/>
    <line x1="560" y1="470" x2="720" y2="470"/>
  </g>

  <!-- Force arrows -->
  <g stroke="#1e5fa8" stroke-width="4" fill="none" marker-end="url(#arrowBlue)">
    <line x1="835" y1="540" x2="835" y2="390"/>
    <line x1="920" y1="600" x2="760" y2="600"/>
  </g>

  <!-- Brace force arrow -->
  <g stroke="#d6417a" stroke-width="4" fill="none" marker-end="url(#arrowPink)">
    <line x1="790" y1="180" x2="700" y2="90"/>
  </g>

  <!-- Labels -->
  <g font-family="Arial, sans-serif" font-size="27" fill="#111">
    <text x="190" y="170">Beam W530x66</text>
    <text x="706" y="72">Brace HSS 203x203x13</text>
    <text x="760" y="575">Horizontal force</text>
    <text x="858" y="385">Vertical force</text>
    <text x="860" y="230">Brace force N = 1670 kN</text>
    <text x="395" y="620">Welded gusset + stiffeners / doubler plates</text>
  </g>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1e5fa8"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d6417a"/>
    </marker>
  </defs>
</svg>




